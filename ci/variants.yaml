# 12 个构建变体 → Manifest 参数映射(CLAUDE.md §6)。
# gen_manifest.py 按此渲染包内 manifest.yaml;deploy.files 由脚本扫描包内容生成,不在此声明。
# 约定:
#   - env 值中的 {workdir} 占位符由 Client Agent 部署时替换,此处原样保留。
#   - Linux 变体已接入设备测试链路(Phase 4);soc/capabilities 为设备调度约束。
#   - workdir_linux 不能用 /opt:RK3568 固件 rootfs 整体只读(2026-08-04 实机:
#     /opt、/root 均 Read-only)。2026-08-07 起用 /tmp(/data 在 QCS6490 是 noexec,
#     run.sh 无法执行;QCS ext4 与 RK3568 tmpfs 的 /tmp 均可写可执行)。
#   - 2026-08-06 包名变更(pipeline 1109):SNPE/TFLite 变体名编码目标 SoC,
#     与业务仓库 ci/hermes/variants.yaml 保持一致;Android SNPE 2.21 目标
#     SoC 从 QCM6125 改为 QCM6490(仅变体名与 soc 变化,签名/环境不变)。

defaults:
  deploy:
    workdir_android: /data/local/tmp/algo-super-sdk
    # 2026-08-07:workdir_linux 改 /tmp——QCS6490 的 /data 挂 noexec,run.sh
    # 无法执行(实测 Permission denied);/tmp 在 QCS(ext4)与 RK3568(tmpfs)
    # 均可写可执行。Android 保持 /data/local/tmp 不变。
    workdir_linux: /tmp/algo-super-sdk
  test:
    entry: ./run.sh
    timeout_sec: 900
    success:
      exit_code: 0
      require_files: [results/result.json]
  collect:
    - results/result.json
    - results/junit.xml
    - logs/*.log
    - dumps/**
  cleanup:
    remove_workdir: true
    keep_on_failure: true
  # 所有 Android 变体共有的失败签名
  signatures_common_android:
    - { id: native_crash, where: logcat, pattern: "Fatal signal|tombstone", classify: CODE }
  signatures_common_linux:
    - { id: native_crash, where: stderr, pattern: "Segmentation fault|core dumped", classify: CODE }
    # run.sh 把每个测试二进制的输出重定向到 logs/<binary>.log,后端类错误只在那里
    # (2026-08-05 p84:seg 报 Unsupported backend: mtk_tflite,stdout/stderr 均无)
    - { id: backend_unsupported, where: logs, pattern: "Unsupported backend", classify: MODEL }

variants:
  aarch64_Android_QCM6125_SNPE_1.68:
    requirements: { os: android, abi: arm64-v8a, soc: [QCM6125], capabilities: [hexagon], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
      ADSP_LIBRARY_PATH: "{workdir}/lib/dsp;/system/lib/rfsa/adsp"
    test:
      args: []
    signatures:
      # where=stdout:实测(2026-07-22 p48)SDK 测试二进制输出走 stdout.log,不进 logcat;
      # 扫 logcat 永远命中不到,native_crash 除外(系统 tombstone 确实在 logcat)。
      - { id: cpu_fallback, where: stdout, pattern: "Falling back to CPU", classify: MODEL }
      # 2026-07-24 p53:DSP 委派不可用(unsigned PD 不支持),gesture 等强依赖 DSP 的用例 init 失败
      - { id: dsp_unavailable, where: stdout, pattern: "RUNTIME_NOT_AVAILABLE|DspTransport.*not supported|DSP does not support", classify: DELEGATE }

  aarch64_Android_QCM6490_SNPE_2.21:
    # 2026-08-06 包名变更:SNPE 2.21 目标 SoC 从 QCM6125 改为 QCM6490(编码进变体名)
    requirements: { os: android, abi: arm64-v8a, soc: [QCM6490], capabilities: [hexagon], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
      ADSP_LIBRARY_PATH: "{workdir}/lib/dsp;/system/lib/rfsa/adsp"
    test:
      args: []
    signatures:
      - { id: cpu_fallback, where: stdout, pattern: "Falling back to CPU", classify: MODEL }
      # 2026-07-24 p53:DSP 委派不可用(unsigned PD 不支持),gesture 等强依赖 DSP 的用例 init 失败
      - { id: dsp_unavailable, where: stdout, pattern: "RUNTIME_NOT_AVAILABLE|DspTransport.*not supported|DSP does not support", classify: DELEGATE }

  aarch64_Android_RK3562_RKNN_2.3.2:
    requirements: { os: android, abi: arm64-v8a, soc: [RK3562], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: stdout, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Android_RK3568_RKNN_2.3.2:
    requirements: { os: android, abi: arm64-v8a, soc: [RK3568], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: stdout, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Android_RK3576_RKNN_2.3.2:
    requirements: { os: android, abi: arm64-v8a, soc: [RK3576], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: stdout, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Android_Qualcomm_TFLite_2.21.0:
    # 2026-08-06 包名变更:Android TFLite 明确为高通平台(变体名编码 Qualcomm)。
    # CONTRACT-ISSUE: 2026-08-06 实机发现该变体原先无 soc 约束,调度器会把包
    # 派到任意 Android 板(实测选中 MTK mt8189,而包内 GPU delegate 是 Adreno)。
    # 与 SNPE 变体对齐,加高通 SoC 约束;fleet 无匹配设备时由 SelectTestSpecs
    # 秒级跳过,不再错误派发。
    requirements: { os: android, abi: arm64-v8a, soc: [QCM6125, QCM6490], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: delegate_fallback, where: stdout, pattern: "falling back to CPU|Delegate creation failed", classify: DELEGATE }

  aarch64_Linux_QCS6125_SNPE_1.68:
    # SNPE=高通 SDK:目标是任意带 hexagon 的高通 Linux 板,不限定具体 SoC 型号
    # (soc 留空=不约束;hexagon 能力即高通 DSP 的判据。2026-08-05 review;
    #  2026-08-06 变体名编码 QCS6125,但需求约束不变)
    requirements: { os: linux, abi: arm64-v8a, capabilities: [hexagon], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
      ADSP_LIBRARY_PATH: "{workdir}/lib/dsp"
    test:
      args: []
    signatures:
      - { id: cpu_fallback, where: logs, pattern: "Falling back to CPU", classify: MODEL }
      - { id: dsp_unavailable, where: logs, pattern: "RUNTIME_NOT_AVAILABLE|DspTransport.*not supported|DSP does not support", classify: DELEGATE }

  aarch64_Linux_QCS6490_SNPE_2.21:
    requirements: { os: linux, abi: arm64-v8a, capabilities: [hexagon], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
      ADSP_LIBRARY_PATH: "{workdir}/lib/dsp"
    test:
      args: []
    signatures:
      - { id: cpu_fallback, where: logs, pattern: "Falling back to CPU", classify: MODEL }
      - { id: dsp_unavailable, where: logs, pattern: "RUNTIME_NOT_AVAILABLE|DspTransport.*not supported|DSP does not support", classify: DELEGATE }

  aarch64_Linux_RK3562_RKNN_2.3.2:
    requirements: { os: linux, abi: arm64-v8a, soc: [RK3562], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: logs, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Linux_RK3568_RKNN_2.3.2:
    requirements: { os: linux, abi: arm64-v8a, soc: [RK3568], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: logs, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Linux_RK3576_RKNN_2.3.2:
    requirements: { os: linux, abi: arm64-v8a, soc: [RK3576], capabilities: [rknpu], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: rknn_init_fail, where: logs, pattern: "rknn_init.*fail|RKNN_ERR", classify: DELEGATE }

  aarch64_Linux_Qualcomm_TFLite_2.21.0:
    # 2026-08-07 一步到位:彻底约束到高通 QCS 板,保证 GPU(Adreno) delegate 验证。
    # soc 用 QCS6125/QCS6490(agent 侧 AGENT_SOC_ALIASES 需 idp:QCS6490 映射,
    # 否则 QCS 板上报 idp 匹配不上);capabilities 加 adreno(能力表需同步声明)。
    # 不再保留 RK 兜底——跑在 RK 板上的 TFLite 无法验证 GPU delegate,名不副实。
    requirements: { os: linux, abi: arm64-v8a, soc: [QCS6125, QCS6490], capabilities: [hexagon, adreno], min_free_storage_mb: 512 }
    env:
      LD_LIBRARY_PATH: "{workdir}/lib"
    test:
      args: []
    signatures:
      - { id: delegate_fallback, where: logs, pattern: "falling back to CPU|Delegate creation failed", classify: DELEGATE }
