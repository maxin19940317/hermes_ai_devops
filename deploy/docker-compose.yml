name: hermes-runtime

x-runtime-common: &runtime-common
  image: hermes-runtime:${RUNTIME_IMAGE_TAG:-dev}
  restart: unless-stopped
  networks: [runtime]
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &runtime-environment
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_TASK_QUEUE: device-test
    # 受控命令接口(MCP bridge 调 POST /api/v1/cmd 的 Bearer 密钥,2026-08-07);
    # 空 = 接口未启用(401)。
    CMD_API_TOKEN: ${CMD_API_TOKEN:-}
    # 测试结果回填 hermes workflow_runtime 的桥(方案 B,2026-08-07);
    # URL 空 = 跳过(开发模式)。worker 经 hermes-runtime 网络访问 rocklin。
    WORKFLOW_BRIDGE_URL: ${WORKFLOW_BRIDGE_URL:-}
    WORKFLOW_BRIDGE_TOKEN: ${WORKFLOW_BRIDGE_TOKEN:-}
    DATABASE_URL: >-
      host=postgres port=5432 user=${RUNTIME_DB_USER:-hermes_runtime}
      password=${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD is required}
      dbname=hermes_runtime sslmode=disable

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must come from images.lock.env}
    restart: unless-stopped
    networks: [runtime]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-temporal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-hermes_runtime}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/10-runtime-db.sh:/docker-entrypoint-initdb.d/10-runtime-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal:
    image: ${TEMPORAL_IMAGE:?TEMPORAL_IMAGE must come from images.lock.env}
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-temporal_admin}
      POSTGRES_PWD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    healthcheck:
      # auto-setup binds the frontend to the container IP, not 127.0.0.1.
      test: [CMD-SHELL, "tctl --address \"$$(hostname -i):7233\" cluster health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:?TEMPORAL_UI_IMAGE must come from images.lock.env}
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_HOST_PORT:-18080}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-18080}:8080"

  trigger:
    <<: *runtime-common
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:?GO_IMAGE must come from images.lock.env}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:?RUNTIME_BASE_IMAGE must come from images.lock.env}
    command: [/app/hermes-trigger]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      TRIGGER_ADDR: :8090
      TRIGGER_WEBHOOK_SECRET: ${TRIGGER_WEBHOOK_SECRET:?TRIGGER_WEBHOOK_SECRET is required}
      # kick 已接(变体级触发,§6.3):false 关闭 pipeline success webhook 触发语义
      # (webhook 仅记录,不再起 bundle workflow,防与 kick 双跑)。
      TRIGGER_PIPELINE_WEBHOOK: ${TRIGGER_PIPELINE_WEBHOOK:-true}
      TRIGGER_REFS: ${TRIGGER_REFS:-master}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab2.quectel.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:?GITLAB_TOKEN is required}
      GITLAB_TOKEN_HEADER: ${GITLAB_TOKEN_HEADER:-PRIVATE-TOKEN}
      PACKAGE_NAME: ${PACKAGE_NAME:-algo-super-sdk}
      # /kick 产物 URL 额外来源白名单(MinIO 等),逗号分隔;缺省仅 GitLab。
      PACKAGE_URL_BASES: ${PACKAGE_URL_BASES:-${MINIO_PUBLIC_ENDPOINT:-}}
    ports:
      - "${TRIGGER_BIND_IP:-0.0.0.0}:${TRIGGER_HOST_PORT:-18090}:8090"
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8090/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    <<: *runtime-common
    command: [/app/hermes-worker]
    depends_on:
      trigger:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      WORKER_CALLBACKS_ADDR: :8091
      VARIANTS_CONFIG: /etc/hermes/variants.yaml
      # 方案 B(2026-08-06):设备能力表归 Runtime 统一管理(服务端权威)。
      # JSON {"<soc|serial>":["<cap>"]};空 = 回退 Agent 上报能力。
      # 新板接入只需在此加一行 + 重启 worker,无需改 Windows Agent。
      DEVICE_CAPABILITIES_MAP: ${DEVICE_CAPABILITIES_MAP:-}
      # 平台代号→型号表(2026-08-07):Agent 服务模式读系统 env,ps1 的 $env:
      # 不生效,代号(idp/bengal)在服务端兜底归一化。JSON {"代号":"型号"}。
      DEVICE_SOC_ALIASES: ${DEVICE_SOC_ALIASES:-}
      DEVICE_WAIT_ROUNDS: ${DEVICE_WAIT_ROUNDS:-20}
      DEVICE_WAIT_SECONDS: ${DEVICE_WAIT_SECONDS:-30}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-http://127.0.0.1:18091}
      ARTIFACT_AUTH_TYPE: ${ARTIFACT_AUTH_TYPE:-bearer}
      ARTIFACT_AUTH_TOKEN: ${ARTIFACT_AUTH_TOKEN:-}
      ARTIFACT_AUTH_USERNAME: ${ARTIFACT_AUTH_USERNAME:-}
      # 产物 auth 仅适用于该 GitLab 基址;其余来源(MinIO 公开桶)匿名下载。
      ARTIFACT_AUTH_GITLAB_BASE: ${GITLAB_BASE_URL:-https://gitlab2.quectel.com}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_RECEIVE_ID: ${FEISHU_RECEIVE_ID:-}
      FEISHU_RECEIVE_ID_TYPE: ${FEISHU_RECEIVE_ID_TYPE:-}
      FEISHU_CMD_WHITELIST: ${FEISHU_CMD_WHITELIST:-}
      ESCALATION_ENDPOINT: ${ESCALATION_ENDPOINT:-}
      ESCALATION_TOKEN: ${ESCALATION_TOKEN:-}
      ESCALATION_MIN_CONFIDENCE: ${ESCALATION_MIN_CONFIDENCE:-}
      FEISHU_CMD_NL: ${FEISHU_CMD_NL:-false}
      FEISHU_CMD_NL_TIMEOUT_SEC: ${FEISHU_CMD_NL_TIMEOUT_SEC:-60}
      UPLOAD_REQUEST_MAX_FILES: ${UPLOAD_REQUEST_MAX_FILES:-64}
      # §3.7 预签名直传;worker 不 depends_on minio——MinIO 缺失时优雅降级为空
      # presigned_uploads。签名覆盖 Host,故预签名 client 用 PUBLIC endpoint 构造。
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-hermes-evidence}
      MINIO_PRESIGN_TTL: ${MINIO_PRESIGN_TTL:-1h}
      # Phase 2 Analyzer(§12):复用 q-uat hermes-agent 平台(§4,宿主 8090,不在本
      # Compose 内);HERMES_ENDPOINT 为空 → Analyzer 禁用,verdict 由规则引擎保底。
      # 平台在宿主机上,容器内需填宿主 LAN 地址(如 http://<宿主IP>:8090/...)。
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-}
      HERMES_AUTH_TOKEN: ${HERMES_AUTH_TOKEN:-}
      HERMES_TIMEOUT_SEC: ${HERMES_TIMEOUT_SEC:-60}
      HERMES_MODEL: ${HERMES_MODEL:-}
      # Agent 最低版本门禁(Phase 3):空 = 不启用;dev 版本 Agent 永远放行。
      MIN_AGENT_VERSION: ${MIN_AGENT_VERSION:-}
      # Phase 3 mTLS(§12):三件套齐全时启用双向证书认证。
      MTLS_CA_FILE: ${MTLS_CA_FILE:-}
      MTLS_CERT_FILE: ${MTLS_CERT_FILE:-}
      MTLS_KEY_FILE: ${MTLS_KEY_FILE:-}
    volumes:
      - ${MTLS_CERTS_DIR:-./certs}:/etc/hermes/certs:ro
    ports:
      - "${WORKER_CALLBACKS_BIND_IP:-0.0.0.0}:${WORKER_CALLBACKS_HOST_PORT:-18091}:8091"
    healthcheck:
      # mTLS(2026-08-04)后 8091 只讲 https;先试带客户端证书的 mTLS,
      # 失败再退明文 http(兼容 MTLS_* 未配置的可选部署)。
      test: ["CMD-SHELL", "wget -qO- --ca-certificate=/etc/hermes/certs/ca-cert.pem --certificate=/etc/hermes/certs/client-windows-client-01.pem https://127.0.0.1:8091/healthz || wget -qO- http://127.0.0.1:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  relay:
    <<: *runtime-common
    command: [/app/hermes-relay]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      # 事务性 Outbox 投递(设计基线 v1.0 原则 3):无监听端口,崩溃由 restart 策略拉起。
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-100}
      RELAY_POLL_INTERVAL: ${RELAY_POLL_INTERVAL:-1s}
      RELAY_MAX_BACKOFF: ${RELAY_MAX_BACKOFF:-30s}
      # 积压监控:relay 定期把 pending/stuck/最老行年龄打进日志("outbox backlog"),
      # 卡住或积压过久升 warn,可直接作告警条件;人工排查见视图 outbox_backlog。
      RELAY_BACKLOG_INTERVAL: ${RELAY_BACKLOG_INTERVAL:-1m}
      RELAY_STUCK_ATTEMPTS: ${RELAY_STUCK_ATTEMPTS:-3}
      RELAY_BACKLOG_WARN_AGE: ${RELAY_BACKLOG_WARN_AGE:-5m}
      # 设备隔离通知(spec §9.2/§9.3)。共享锚点 runtime-environment 不含
      # FEISHU_*,relay 需要独立通知端才能真正发出 device-quarantined 事件,
      # 这里显式补传——不传等价于让隔离通知永久卡在 outbox backlog 里。
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_RECEIVE_ID: ${FEISHU_RECEIVE_ID:-}
      FEISHU_RECEIVE_ID_TYPE: ${FEISHU_RECEIVE_ID_TYPE:-}
      # 三种语义(留空/off/已配置)见 deploy/.env.example 对应注释与 spec §9.3。
      RELAY_DEVICE_NOTIFY: ${RELAY_DEVICE_NOTIFY:-}

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must come from images.lock.env}
    restart: unless-stopped
    networks: [runtime]
    # --console-address 固定控制台端口,否则每次启动随机端口,9001 映射失效。
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      # 决策 2:UAT 期间 9000 绑测试网段供 Windows Client 直传;控制台保持 localhost。
      - "${MINIO_BIND_IP:-0.0.0.0}:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # minio 镜像内置 curl(无 wget);/minio/health/live 为官方存活探针。
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE must come from images.lock.env}
    networks: [runtime]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-hermes-evidence}
      MINIO_PACKAGE_BUCKET: ${MINIO_PACKAGE_BUCKET:-hermes-packages}
      MINIO_RUNS_RETAIN_DAYS: ${MINIO_RUNS_RETAIN_DAYS:-90}
      MINIO_PACKAGES_RETAIN_DAYS: ${MINIO_PACKAGES_RETAIN_DAYS:-30}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set hermes http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "hermes/$$MINIO_BUCKET"
        # 产物桶(§包源扩展):/kick 可引用本机 MinIO 上的包。
        # 公开读(下载不需要签名;探活/Agent 均匿名 GET)。生命周期:产物短保留,
        # 覆盖策略靠文件名唯一,失败包无生命周期规则说明已被新包覆盖。
        mc mb --ignore-existing "hermes/$$MINIO_PACKAGE_BUCKET"
        mc anonymous set download "hermes/$$MINIO_PACKAGE_BUCKET"
        mc ilm rule rm --all --force "hermes/$$MINIO_PACKAGE_BUCKET" 2>/dev/null || true
        mc ilm rule add --expire-days "$$MINIO_PACKAGES_RETAIN_DAYS" --prefix "/" "hermes/$$MINIO_PACKAGE_BUCKET"
        # 生命周期(§12 Phase 3)。两类对象保留语义不同,按前缀分开配:
        #   runs/      原始附件(logcat/stdout/junit/dump),体量大,到期清理
        #   evidence/  证据快照(≤96KB),保留周期随 decisions 行,故**不设过期规则**
        # (device-test-sequence.md:364:"原始大日志可按生命周期清理;evidence 快照
        #  保留周期与 Decision 一致")。
        # 幂等:先清空整个 lifecycle 配置再重建,重复执行不会叠加规则。
        mc ilm rule rm --all --force "hermes/$$MINIO_BUCKET" 2>/dev/null || true
        mc ilm rule add --expire-days "$$MINIO_RUNS_RETAIN_DAYS" --prefix "runs/" "hermes/$$MINIO_BUCKET"
        mc ilm rule ls "hermes/$$MINIO_BUCKET"

  # Phase 4 Grafana(§12):纯观测层,不写任何数据,不进执行关键路径。
  # 数据源直连 postgres(hermes_runtime 库),dashboard JSON 进 Git 随 compose
  # provisioning 自动加载——改了面板推一下即生效,无需手动导入。
  # 端口绑 localhost,远程访问走 SSH 端口转发(同 Temporal UI)。
  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE must come from images.lock.env}
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # datasource provisioning 用 ${VAR} 插值(见 provisioning/datasources/postgres.yaml)
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-hermes_runtime}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?RUNTIME_DB_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

networks:
  runtime:
    name: hermes-runtime
    driver: bridge
    ipam:
      config:
        # 显式固定网段:Docker 自动分配可能撞上内网真实设备(曾撞 172.22)。
        - subnet: ${RUNTIME_SUBNET:-172.31.240.0/24}

volumes:
  postgres-data:
    name: hermes-runtime-postgres
  grafana-data:
    name: hermes-runtime-grafana
  minio-data:
    name: hermes-runtime-minio
