# Client → Runtime 回调 API v1 (CLAUDE.md §8.2)
# 回调可能重发:Runtime 按 idempotency_key + seq 去重,Temporal signal 只投递一次。
openapi: 3.1.0
info:
  title: Hermes DevOps Runtime Callbacks API
  version: 1.0.0
  description: |
    Client Agent 上报心跳/状态迁移事件/终态结果的回调接口。
    - heartbeat 每 10s 一次,携带租约所有权凭据只续数据库租约(原则 6,
      不向 Workflow 发 signal);凭据失配逐项返回 LEASE_NOT_OWNED。
    - 所有回调均幂等,重发返回 200 且不产生副作用。
security:
  - mtls: []
paths:
  /callbacks/v1/heartbeat:
    post:
      operationId: heartbeat
      summary: 心跳 + 设备状态 + 进行中任务(租约续期)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: 已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatAck'
  /callbacks/v1/task-events:
    post:
      operationId: reportTaskEvent
      summary: 任务状态迁移事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEvent'
      responses:
        '200':
          description: 已接收(含重复事件,按 idempotency_key+seq 去重)
        '400':
          description: 事件不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /callbacks/v1/results:
    post:
      operationId: reportResult
      summary: 终态结果(附件已直传 MinIO,只传对象键清单)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultReport'
      responses:
        '200':
          description: 已接收(重复上报幂等)
        '400':
          description: result 未通过 result.schema.json 校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    mtls:
      type: mutualTLS
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Heartbeat:
      type: object
      additionalProperties: false
      required: [client_id, agent_version, ts, devices, active_task_ids]
      properties:
        client_id: { type: string, minLength: 1 }
        base_url:
          type: string
          format: uri
          description: |
            本 Client 的 API 基地址(https://host:port),Runtime 派单用。
            CONTRACT-ISSUE: §8.2 原文心跳载荷未含派单地址,Runtime 无从得知
            Client API 端点;按"只加字段不删字段"新增可选字段。
        agent_version: { type: string }
        ts: { type: string, format: date-time, description: UTC 毫秒精度 }
        devices:
          type: array
          items:
            type: object
            required: [serial, state]
            properties:
              serial: { type: string }
              state: { enum: [IDLE, BUSY, OFFLINE] }
              props:
                type: object
                properties:
                  soc: { type: string }
                  abi: { type: string }
                  android: { type: string }
                  capabilities:
                    type: array
                    items: { type: string }
              workdir_free_mb: { type: integer, minimum: 0 }
        active_task_ids:
          type: array
          description: |
            进行中任务列表,即租约续期依据(§10)。
            过渡期双格式(差距 #15):元素为对象时携带租约所有权凭据
            (lease_id/lease_generation,派单时下发),执行条件续租,
            失配在响应 not_owned 中逐项返回 LEASE_NOT_OWNED;
            元素为纯字符串(旧格式)时仅续 client 心跳、不续租、不报错。

            字符串格式已 **deprecated**(2026-07-29)。所有在役 Agent 均已升级到
            会发对象格式的版本,但 Agent 仍保留字符串回退:本地任务记录里没有
            lease_id 时(即该任务由尚未下发凭据的旧 Runtime 派出)只能发字符串。
            因此下线条件不是"Agent 升级完",而是"不再存在无 lease_id 的在途任务"
            ——即全部 Agent 升级 **且** 升级前派出的任务都已走到终态。
            届时才可删除本 oneOf 的 string 分支(契约只加不删,删除属破坏性变更,
            需 *_version 递增与双向版本协商)。
          items:
            oneOf:
              - type: string
                deprecated: true
                description: |
                  旧格式:仅任务 id。Runtime 收到时只续 client 心跳,不续租、不报错。
                  见上方 active_task_ids 的下线条件。
              - $ref: '#/components/schemas/ActiveTask'
    ActiveTask:
      type: object
      additionalProperties: false
      required: [task_id, attempt, lease_id, lease_generation]
      properties:
        task_id: { type: string, minLength: 1 }
        attempt: { type: integer, minimum: 1 }
        lease_id: { type: string, minLength: 1 }
        lease_generation: { type: integer, minimum: 1 }
    HeartbeatAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        min_agent_version:
          type: string
          description: Runtime 要求的最低 Agent 版本,低于此版本将被拒绝派单
        cancel_task_ids:
          type: array
          items: { type: string }
          description: Runtime 侧已判死(如租约易主)、要求 Client 停止的任务
        not_owned:
          type: array
          description: |
            租约所有权校验失败的任务(§10):Client 必须立即停止操作
            (设备可能已租给其他 workflow)。缺省/空 = 全部续租成功。
          items:
            type: object
            additionalProperties: false
            required: [task_id, code]
            properties:
              task_id: { type: string }
              code: { enum: [LEASE_NOT_OWNED] }
    TaskEvent:
      type: object
      additionalProperties: false
      required: [task_id, idempotency_key, seq, from, to, ts]
      properties:
        task_id: { type: string, minLength: 1 }
        idempotency_key: { type: string, minLength: 1 }
        seq:
          type: integer
          minimum: 1
          description: 单任务内单调递增,与 idempotency_key 联合去重
        from: { $ref: '#/components/schemas/TaskState' }
        to: { $ref: '#/components/schemas/TaskState' }
        ts: { type: string, format: date-time }
        detail: { type: string, maxLength: 2000 }
    TaskState:
      enum:
        - QUEUED
        - ACCEPTED
        - PREPARING
        - DOWNLOADING
        - DEPLOYING
        - RUNNING
        - COLLECTING
        - COMPLETED
        - FAILED
        - TIMEOUT
        - CANCELED
    ResultReport:
      type: object
      additionalProperties: false
      required: [task_id, idempotency_key, result]
      properties:
        task_id: { type: string, minLength: 1 }
        idempotency_key: { type: string, minLength: 1 }
        result:
          type: object
          description: result.json v1 全文,Runtime 消费前必须用 contracts/result.schema.json 校验(红线 §14)
